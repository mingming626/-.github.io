<main class="container">
  <h2>我们的相册</h2>
  <p class="muted">把照片放到 <code>assets/photos/</code> 文件夹，这个页面会自动显示。示例图片已放 3 张。</p>
  <div class="gallery" id="gallery"></div>
</main>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const imgs = ['assets/photos/photo1.jpg','assets/photos/photo2.jpg','assets/photos/photo3.jpg'];
  const g = document.getElementById('gallery');
  imgs.forEach(src=>{
    const a = document.createElement('a');
    a.href = src; a.target="_blank"; a.className="g-item";
    const img = document.createElement('img'); img.src = src; img.alt = "我们的照片";
    a.appendChild(img); g.appendChild(a);
  });
});
</script>

</body>
