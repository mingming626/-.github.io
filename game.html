  <h2>我们的小游戏</h2>
  <p>这是我们一起做的小游戏「小骑士拯救公主」。由于使用 Python + Pygame 开发，需下载到本地运行。</p>
  <div class="card">
    <h3>下载方式</h3>
    <ol>
      <li>下载 <a class="link" href="downloads/knight_game.zip">knight_game.zip</a> 并解压。</li>
      <li>安装 Python 3.11+，在命令行运行：<code>pip install pygame</code></li>
      <li>进入文件夹，运行：<code>python knight_love_game.py</code></li>
      <li>操作：方向键移动，F11 切换全屏，靠近公主触发彩蛋。</li>
    </ol>
  </div>
